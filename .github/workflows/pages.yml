# Publishes whilton-coach/dist/index.html to GitHub Pages so phones can use GPS (Safari needs HTTPS).
# One-time setup in the repository settings: Pages, Build and deployment, Source: GitHub Actions.
name: Publish the Whilton coach to GitHub Pages
on:
  push:
    branches: [main, master, claude/pre-race-guide-support-rpr0k8]
    paths: [whilton-coach/dist/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the single-file app
        run: |
          mkdir -p site
          cp whilton-coach/dist/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
