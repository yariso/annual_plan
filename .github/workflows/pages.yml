# Publishes whilton-coach/dist/index.html to GitHub Pages so phones can use GPS (Safari needs HTTPS).
# One-time setup: either add a PAGES_TOKEN secret (see below) or set Pages, Build and deployment, Source: GitHub Actions.
name: Publish the Whilton coach to GitHub Pages
on:
  push:
    branches: [main, master, claude/pre-race-guide-support-rpr0k8]
    paths: [whilton-coach/dist/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the single-file app
        run: |
          mkdir -p site
          cp whilton-coach/dist/index.html site/index.html
      - uses: actions/configure-pages@v5
        with:
          # Switching Pages on needs a token with Administration and Pages write access on the repository.
          # Store a fine-grained personal access token as the PAGES_TOKEN repository secret, or enable Pages
          # once by hand under Settings, Pages, Source: GitHub Actions. Publishing itself works with the built-in token.
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
